<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>短歌詠草集・解題作成ツール</title>
    <!-- 外部ライブラリ：画面要素をPDFに変換するライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
            background-color: #faf8f5;
            color: #2b2b2b;
            margin: 0;
            padding: 0;
        }

        /* --- 画面表示用スタイリング --- */
        .screen-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e8e2d9;
        }

        h2 {
            color: #5c1d24;
            border-bottom: 2px solid #5c1d24;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 1.4rem;
        }

        .step-desc {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #444;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fcfbf9;
            font-family: inherit;
        }

        .input-field:focus {
            outline: none;
            border-color: #5c1d24;
            background-color: #fff;
        }

        /* 司会者のラジオボタン */
        .mc-label {
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            color: #555;
        }

        /* 参加者動的リスト用 */
        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        /* 作者選択用ラジオボタン群 */
        .author-radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px;
            background-color: #f7f5f0;
            border-radius: 4px;
            border: 1px solid #e2ddd5;
            margin-bottom: 12px;
        }

        .author-radio-label {
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #5c1d24;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #7a2730;
        }

        .btn-secondary {
            background-color: #e0dcd5;
            color: #333;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: #d0cac0;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
        }

        .count-info {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
        }

        .hidden {
            display: none !important;
        }

        /* --- PDF生成用の非表示ラッパー（画面外に配置） --- */
        #pdf-render-wrapper {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }

        /* --- PDFレイアウト（A4横置き: 297mm x 210mm） --- */
        .pdf-page {
            width: 297mm;
            height: 210mm;
            padding: 15mm;
            background-color: #fff;
            color: #2b2b2b;
            font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", serif;
            box-sizing: border-box;
            -webkit-writing-mode: vertical-rl;
            writing-mode: vertical-rl;
            /* text-orientation: upright; */
        }

        .pdf-header {
            border-left: 2px solid #5c1d24;
            padding-left: 15px;
            margin-left: 25px;
            height: 100%;
        }

        .pdf-title {
            font-size: 18pt;
            font-weight: bold;
            color: #5c1d24;
            margin: 0 0 0 10pt;
            /* 縦書き用の余白 */
            letter-spacing: 2px;
        }

        .pdf-meta {
            font-size: 9pt;
            color: #444;
            display: flex;
            line-height: 1.8;
            letter-spacing: 1px;
        }

        .pdf-meta div {
            margin-left: 10px;
            /* 縦書き時の行間調整 */
            margin-bottom: 30px;
            /*変更中*/
        }

        /* 短歌一覧（縦書きレイアウト） */
        .tanka-container {
            height: 100%;
            width: 100%;
            padding-top: 5mm;
            margin-right: 50px;
            /*変更中*/
        }

        .tanka {
            margin-left: 30px;
            margin-right: 5px;
            font-size: 13pt;
            line-height: 2.2;
            letter-spacing: 2px;
            padding-left: 15px;
        }

        .tanka-author {
            font-size: 10pt;
            color: #333;
            margin-top: 20px;
            text-align: right;
        }
    </style>
</head>

<body>

    <!-- STEP 1: 歌会情報の入力 -->
    <div id="step-1" class="screen-container">
        <h2>1. 歌会情報の入力</h2>
        <p class="step-desc">歌会の情報を入力してください（空欄でも構いません）。</p>

        <div class="input-group">
            <label for="event-title">歌会タイトル</label>
            <input type="text" id="event-title" class="input-field" placeholder="例: 定例歌会（未入力の場合は「歌会」となります）">
        </div>

        <div class="input-group">
            <label for="event-date">日時</label>
            <input type="text" id="event-date" class="input-field" placeholder="例: 1920/8/7">
        </div>

        <div class="input-group">
            <label for="event-location">場所</label>
            <input type="text" id="event-location" class="input-field" placeholder="例: サークル室A">
        </div>

        <div class="input-group">
            <label>参加者と司会者の選択</label>
            <div id="member-list-container">
                <!-- 司会者未選択用のラジオボタン -->
                <div style="margin-bottom: 8px; font-size: 0.85rem; color: #666;">
                    <label style="cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
                        <input type="radio" name="mc-choice" value="" checked> （司会者なし / 選択しない）
                    </label>
                </div>

                <!-- 参加者入力行 1 -->
                <div class="member-item">
                    <input type="text" class="input-field member-input" placeholder="参加者名 1">
                    <label class="mc-label">
                        <input type="radio" name="mc-choice" value="0"> 司会
                    </label>
                </div>
            </div>
            <button id="add-member-btn" class="btn-secondary btn-small" style="margin-top: 8px;">+ 参加者を追加</button>
        </div>

        <div class="btn-group">
            <button id="to-step-2-btn" class="btn-primary">次へ（歌を入力）</button>
        </div>
    </div>

    <!-- STEP 2: 短歌の入力 -->
    <div id="step-2" class="screen-container hidden">
        <h2>2. 短歌と作者の入力</h2>
        <p class="step-desc">作者を選択し、短歌を入力後「次の歌を入力」を押してください。<br>※一度登録された作者は選択肢から自動で除外されます。</p>

        <div class="input-group">
            <label>作者</label>
            <div id="author-radio-container" class="author-radio-group">
                <!-- ラジオボタンが動的に生成されます -->
            </div>
        </div>

        <div class="input-group">
            <label for="tanka-input">短歌</label>
            <input type="text" id="tanka-input" class="input-field" placeholder="短歌を入力..." autofocus>
            <div class="count-info">現在の入力数: <span id="tanka-count">0</span> 首</div>
        </div>

        <div class="btn-group">
            <button id="next-tanka-btn" class="btn-primary" style="background-color: #2b5c1d;">次の歌を入力</button>
            <button id="finish-btn" class="btn-primary">完了（シャッフルする）</button>
            <button id="back-to-step1-btn" class="btn-secondary">歌会情報を変更</button>
            <button id="reset-btn" class="btn-secondary">リセット</button>
        </div>
    </div>

    <!-- STEP 3: 出力画面 -->
    <div id="step-3" class="screen-container hidden">
        <h2>3. 詠草集・解題のPDFダウンロード</h2>

        <p class="step-desc">短歌の順序がシャッフルされました。<br>PDFファイルをダウンロードできます。</p>

        <div class="btn-group">
            <button id="download-eiso-btn" class="btn-primary">詠草集PDF（作者非表示）をダウンロード</button>
            <button id="download-kaidai-btn" class="btn-primary"
                style="background-color: #2b5c1d;">解題PDF（作者表示）をダウンロード</button>
        </div>

        <div class="btn-group">
            <button id="re-shuffle-btn" class="btn-secondary">再シャッフル</button>
            <button id="restart-btn" class="btn-secondary">最初からやり直す</button>
        </div>
    </div>


    <!-- PDFレンダリング用領域（画面外で生成） -->
    <div id="pdf-render-wrapper">
        <div id="pdf-page-content" class="pdf-page">
            <div class="pdf-header">
                <h1 class="pdf-title" id="pdf-doc-title">歌会 詠草集</h1>
                <div class="pdf-meta">
                    <div id="print-date">日時：</div>
                    <div id="print-location">場所：</div>
                    <div id="print-mc">司会者：</div>
                    <div id="print-members">参加者：</div>
                </div>
            </div>
            <!-- 短歌一覧 -->
            <div class="tanka-container" id="tanka-list"></div>
        </div>
    </div>


    <script>
        // データ保持変数
        const tankaDataList = []; // { text: "", author: "" }
        let membersList = [];
        let remainingAuthors = []; // まだ選択されていない作者のリスト
        let eventInfo = { title: '', date: '', location: '' };
        let shuffledTankaList = [];

        // 要素取得
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');

        const eventTitleInput = document.getElementById('event-title');
        const eventDateInput = document.getElementById('event-date');
        const eventLocationInput = document.getElementById('event-location');
        const memberListContainer = document.getElementById('member-list-container');
        const addMemberBtn = document.getElementById('add-member-btn');

        const authorRadioContainer = document.getElementById('author-radio-container');
        const tankaInput = document.getElementById('tanka-input');
        const tankaCount = document.getElementById('tanka-count');

        const toStep2Btn = document.getElementById('to-step-2-btn');
        const backToStep1Btn = document.getElementById('back-to-step1-btn');
        const nextTankaBtn = document.getElementById('next-tanka-btn');
        const finishBtn = document.getElementById('finish-btn');
        const resetBtn = document.getElementById('reset-btn');

        const downloadEisoBtn = document.getElementById('download-eiso-btn');
        const downloadKaidaiBtn = document.getElementById('download-kaidai-btn');
        const reShuffleBtn = document.getElementById('re-shuffle-btn');
        const restartBtn = document.getElementById('restart-btn');

        // 「+ 参加者を追加」ボタンの処理
        addMemberBtn.addEventListener('click', () => {
            const index = memberListContainer.querySelectorAll('.member-item').length;
            const div = document.createElement('div');
            div.className = 'member-item';
            div.innerHTML = `
        <input type="text" class="input-field member-input" placeholder="参加者名 ${index + 1}">
        <label class="mc-label">
          <input type="radio" name="mc-choice" value="${index}"> 司会
        </label>
      `;
            memberListContainer.appendChild(div);
        });

        // STEP 1 -> STEP 2 (作者ラジオボタンの再描画処理)
        function renderAuthorRadioButtons() {
            authorRadioContainer.innerHTML = '';
            if (remainingAuthors.length === 0) {
                if (membersList.length === 0) {
                    authorRadioContainer.innerHTML = '<span style="color:#888; font-size:0.85rem;">※参加者が未設定です</span>';
                } else {
                    authorRadioContainer.innerHTML = '<span style="color:#888; font-size:0.85rem;">※すべての参加者の短歌が登録されました（この後の入力は作者なしとなります）</span>';
                }
            } else {
                remainingAuthors.forEach((member, index) => {
                    const label = document.createElement('label');
                    label.className = 'author-radio-label';
                    label.innerHTML = `<input type="radio" name="author-choice" value="${member}" ${index === 0 ? 'checked' : ''}> ${member}`;
                    authorRadioContainer.appendChild(label);
                });
            }
        }

        // STEP 1 -> STEP 2 への遷移
        toStep2Btn.addEventListener('click', () => {
            eventInfo.title = eventTitleInput.value.trim() || '歌会';
            eventInfo.date = eventDateInput.value.trim();
            eventInfo.location = eventLocationInput.value.trim();

            // 参加者と司会者の取得
            const inputs = document.querySelectorAll('.member-input');
            const selectedMcRadio = document.querySelector('input[name="mc-choice"]:checked');
            const mcIndex = selectedMcRadio ? selectedMcRadio.value : "";

            membersList = [];
            let mcName = "";

            inputs.forEach((input, idx) => {
                const val = input.value.trim();
                if (val) {
                    membersList.push(val);
                    // 選択されたラジオボタンのインデックスと一致すれば司会者として保持
                    if (mcIndex !== "" && parseInt(mcIndex, 10) === idx) {
                        mcName = val;
                    }
                }
            });

            eventInfo.mc = mcName; // 司会者を保存

            // 選択可能な作者リストの初期化（未選択のものをコピー）
            remainingAuthors = [...membersList];

            // すでに登録された短歌がある場合の作者除外処理（戻った場合などのケア）
            tankaDataList.forEach(item => {
                if (item.author) {
                    remainingAuthors = remainingAuthors.filter(a => a !== item.author);
                }
            });

            renderAuthorRadioButtons();

            step1.classList.add('hidden');
            step2.classList.remove('hidden');
            tankaInput.focus();
        });

        // STEP 2 -> STEP 1
        backToStep1Btn.addEventListener('click', () => {
            step2.classList.add('hidden');
            step1.classList.remove('hidden');
        });

        // 短歌入力欄でのEnterキー無効化（誤操作防止）
        tankaInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
            }
        });

        // 「次の歌を入力」ボタンを押したときの登録処理
        nextTankaBtn.addEventListener('click', () => {
            const textVal = tankaInput.value.trim();
            if (!textVal) {
                alert('短歌を入力してください。');
                return;
            }

            let selectedAuthor = '';
            const checkedRadio = document.querySelector('input[name="author-choice"]:checked');
            if (checkedRadio) {
                selectedAuthor = checkedRadio.value;
            }

            // 短歌データを保存
            tankaDataList.push({
                text: textVal,
                author: selectedAuthor
            });

            // 選択された作者を選択肢から除外
            if (selectedAuthor) {
                remainingAuthors = remainingAuthors.filter(author => author !== selectedAuthor);
            }

            // フォームとラジオボタンを更新
            tankaInput.value = '';
            tankaCount.textContent = tankaDataList.length;
            renderAuthorRadioButtons();
            tankaInput.focus();
        });

        // シャッフル処理
        function shuffleData() {
            shuffledTankaList = [...tankaDataList];
            for (let i = shuffledTankaList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledTankaList[i], shuffledTankaList[j]] = [shuffledTankaList[j], shuffledTankaList[i]];
            }
        }

        // PDF用のHTMLをDOMに反映
        function preparePdfDOM(isKaidai) {
            const displayTitle = eventInfo.title;
            document.getElementById('pdf-doc-title').textContent = isKaidai ? `${displayTitle} 解題` : `${displayTitle}`;
            document.getElementById('print-date').textContent = '日時：' + (eventInfo.date || '未設定');
            document.getElementById('print-location').textContent = '場所：' + (eventInfo.location || '未設定');
            document.getElementById('print-mc').textContent = '司会者：' + (eventInfo.mc || '未設定');
            // 参加者一覧から司会者と一致する名前を除外
            const generalMembers = membersList.filter(member => member !== eventInfo.mc);
            document.getElementById('print-members').textContent = '参加者：' + (generalMembers.join('　') || 'なし');

            const tankaListDiv = document.getElementById('tanka-list');
            tankaListDiv.innerHTML = '';

            shuffledTankaList.forEach((item, index) => {
                const tankaDiv = document.createElement('div');
                tankaDiv.className = 'tanka';

                // 短歌本文
                tankaDiv.appendChild(document.createTextNode(item.text));

                // 解題（作者表示オプション）の場合
                if (isKaidai && item.author) {
                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'tanka-author';
                    authorDiv.textContent = item.author;
                    tankaDiv.appendChild(authorDiv);
                }

                tankaListDiv.appendChild(tankaDiv);
            });
        }

        // 直接PDFをダウンロードする処理 (html2pdfを使用)
        function downloadPDF(isKaidai) {
            preparePdfDOM(isKaidai);

            // ファイル名の生成
            const baseName = eventInfo.title || '歌会';
            const filename = isKaidai ? `${baseName}_解題.pdf` : `${baseName}_詠草集.pdf`;

            const element = document.getElementById('pdf-page-content');
            const opt = {
                margin: 0,
                filename: filename,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                // 横置き（Landscape）設定
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(element).save();
        }

        // 完了ボタンを押した時 (STEP 2 -> STEP 3)
        finishBtn.addEventListener('click', () => {
            // 入力欄に未追加のテキストが残っている場合
            if (tankaInput.value.trim() !== '') {
                if (confirm('入力欄に未保存の短歌があります。「次の歌を入力」を押さずに完了へ進みますか？')) {
                    // 保存せずに進む
                } else {
                    return;
                }
            }

            if (tankaDataList.length === 0) {
                alert('短歌が入力されていません。');
                return;
            }
            shuffleData();
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
        });

        // 詠草集PDFダウンロード
        downloadEisoBtn.addEventListener('click', () => {
            downloadPDF(false);
        });

        // 解題PDFダウンロード
        downloadKaidaiBtn.addEventListener('click', () => {
            downloadPDF(true);
        });

        // 再シャッフル
        reShuffleBtn.addEventListener('click', () => {
            shuffleData();
            alert('短歌を再シャッフルしました。');
        });

        // リセットボタン（入力中の短歌クリア）
        resetBtn.addEventListener('click', () => {
            if (confirm('入力済みの短歌をリセットしますか？')) {
                tankaDataList.length = 0;
                remainingAuthors = [...membersList];
                tankaCount.textContent = '0';
                tankaInput.value = '';
                renderAuthorRadioButtons();
                tankaInput.focus();
            }
        });

        // 最初からやり直す
        restartBtn.addEventListener('click', () => {
            if (confirm('すべての情報をリセットして最初からやり直しますか？')) {
                tankaDataList.length = 0;
                membersList.length = 0;
                remainingAuthors.length = 0;
                tankaCount.textContent = '0';
                eventTitleInput.value = '';
                eventDateInput.value = '';
                eventLocationInput.value = '';
                tankaInput.value = '';
                memberListContainer.innerHTML = '<div class="member-item"><input type="text" class="input-field member-input" placeholder="参加者名 1"></div>';

                step3.classList.add('hidden');
                step1.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
